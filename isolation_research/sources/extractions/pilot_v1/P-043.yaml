notes: "Security discussion is brief (one paragraph on credentials); most of the post covers durable execution, sandbox lifecycle and filesystem virtualization. No explicit threat model, prompt injection, egress control, or host-side delayed execution discussion. The bash/tree-sitter guard is a functional (not security) control for the virtualization layer, but is a relevant data point on the unreliability of command parsing. Title, author and date do not appear in the text and could not be verified. No prompt-injection payload observed in the source."
