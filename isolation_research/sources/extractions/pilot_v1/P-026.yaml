notes: "The metadata matches the text: the author is Aonan Guan (security researcher). The text has no explicit publication date. Its timeline ends with CVE publication on December 2, 2025, which is consistent with 2025-12-03. The PoC video and screenshots are referenced but missing from the clean text. The CVE was assigned only to @anthropic-ai/sandbox-runtime, with CVSS 1.8; the author argues that this understates the risk. A related GitHub PR #45 by bendrucker predates the author's report. The source does not discuss the shared-kernel vs. VM question, prompt-injection classifiers, permission systems as a boundary, or host-delayed execution. No prompt-injection payloads were observed."
