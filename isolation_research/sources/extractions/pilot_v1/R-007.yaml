title: "Progent: Securing AI Agents with Privilege Control"
author_org: "Tianneng Shi, Jingxuan He, Zhun Wang, Hongwei Li, Linyu Wu, Wenbo Guo, Dawn Song (UC Berkeley, UC Santa Barbara, National University of Singapore)"
date: "2025-04-16"
stream: Researcher Sources
sub_stream: ""
author_role: academic
incentives: "Authors propose and evaluate their own defense framework (Progent, open-source artifact); comparisons against prior defenses are run by the authors, so results may favor their system. No commercial product stated."
harness: [OpenHands]
included: true
inclusion_reason: "Proposes and empirically evaluates deterministic least-privilege policy enforcement on tool calls against indirect prompt injection, compares it with PI classifiers and prompt-level defenses, and integrates it with real agent frameworks including OpenHands; generalizes to tool-using coding agents."
recommendations:
  - practice: capability-policy-enforcement
    stance: recommends
    summary: "Enforce least privilege by checking every tool call (tool name and arguments) against symbolic allow/forbid rules with a deterministic procedure; calls matching no rule are blocked by default."
    threats: [prompt-injection-indirect, data-exfiltration, destructive-action]
    rqs: [RQ5]
    evidence_type: design-rationale
    tradeoffs:
      - "Policies that are too broad fail to block attacks; policies that are too narrow break other tasks, hence the need for task- and context-specific policies."
    bypasses_limits:
      - "Cannot defend against attacks that operate within the least privilege needed for the user task (e.g. preference manipulation)."
      - "Does not handle attacks that only target text outputs."
      - "Does not apply to multimodal/GUI actions (clicks on screen)."
    quote: "force the principle of least privilege: allow only tool calls essential"
    location: "Section 1 Introduction, Our Work: Progent"
  - practice: capability-policy-enforcement
    stance: recommends
    summary: "Progent reduces attack success rate on ASB from 70.3% to 3.9% (and on AgentDojo from 39.9% to 1.0%) while keeping utility close to the undefended baseline, even with auto-approval of all policy expansions (worst case)."
    threats: [prompt-injection-indirect]
    rqs: [RQ5]
    evidence_type: empirical-evaluation
    tradeoffs:
      - "Small utility changes; failures occur when attack tool calls look very similar to benign tools related to the task."
    bypasses_limits:
      - "Residual ASR when attack tool names/descriptions closely resemble benign, task-relevant tools."
    quote: "Progent also significantly ... reduces ASR from 70.3% to 3.9%."
    location: "Section 8.1, ASB"
  - practice: capability-policy-enforcement
    stance: recommends
    summary: "LLM generates the initial policy from the trusted user query and updates it at runtime; an SMT solver classifies each update as narrowing (auto-applied) or expansion (needs approval), guaranteeing monotonic confinement so injected content cannot silently escalate privileges."
    threats: [prompt-injection-indirect, privilege-escalation]
    rqs: [RQ5]
    evidence_type: formal-argument
    tradeoffs:
      - "Introducing an LLM for policy construction adds non-determinism, mitigated by the deterministic SMT check."
    bypasses_limits:
      - "Guarantee depends on correct approval decisions; users who approve malicious expansions or give ambiguous tasks weaken it."
    quote: "We call this property Monotonic Confinement: the agent’s action ... space cannot increase without explicit approval."
    location: "Section 6 Progent's Security Guarantee"
