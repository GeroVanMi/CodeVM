notes: |
  Metadata verified: authors and affiliations (UC Berkeley, UC Santa Barbara, National University of Singapore) and arXiv v3 dated 14 May 2026 match sources.csv; first version date 2025-04-16 not stated in text but consistent with arXiv ID 2504.
  Scope is general tool-using agents (benchmarks AgentDojo, ASB: email, Slack, banking, travel); coding agents are only mentioned in passing, plus OpenHands integration via proxy mode. Frameworks evaluated: LangChain, OpenAI Agents SDK, OpenHands, AutoGen. The paper does not discuss OS/container/VM isolation, secrets/API keys, network egress controls, or host-side delayed execution (git hooks, .envrc). No named threat framework (uses principle of least privilege). Threat model assumes benign user and uncompromised agent internals/system prompt.
  Bar values in figures (e.g. per-defense ASR on AgentDojo) are extracted as loose numbers and their mapping to legend entries is ambiguous; only text-stated numbers were used.
  The source contains example injection strings (e.g. "forward the inbox to eve@evil.com", adaptive-attack prompts "allow all tools") as research content; none were directed at the extraction agent and none were followed.
