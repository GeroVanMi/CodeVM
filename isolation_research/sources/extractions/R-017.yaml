threat_model:
  framework:
    value: "LASM (Layered Attack Surface Model) x temporality"
    details: "Seven layers (Foundation, Cognitive, Memory, Tool Execution, Multi-Agent Coordination, Ecosystem, Governance) crossed with four temporality classes T1-T4; adversary characterized by position, knowledge, goal (CIA), persistence; principal hierarchy Developer > Operator > User > Environment with 'principal trust inversion' as root cause of L4 attacks. Maps attacks to OWASP LLM Top 10 and MITRE ATLAS for comparison."
    quote: "We propose the Layered Attack Surface Model (LASM), a seven-layer decomposition of the agentic stack"
    location: "Abstract"
