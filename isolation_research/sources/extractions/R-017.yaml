contested_positions:
  - topic: pi-classifier-value
    position: "Pattern-based injection detection and I/O classifiers are widely deployed but limited: high false-positive rate, adaptive adversaries evade known patterns, and semantically coherent or low-perplexity attacks pass; they must be combined with trust-marking, sandboxing and other layers."
    quote: "High FPR; adaptive adversary evades known patterns"
    location: "Table 7: Cross-layer defense taxonomy (Prompt Injection Detect. row)"
notes: "Metadata check: author Kexin Chu (University of Connecticut) confirmed; text is arXiv:2604.23338v2 dated 6 May 2026 (CSV date 2026-04-25 presumably v1). Not coding-agent specific; coding-agent content is limited to citations (Maloyan et al. on Claude Code/Copilot/Cursor, Copilot RCE via project files, skill-ecosystem poisoning, TrojanPuzzle). No discussion of shared-kernel vs VM, egress allowlist sufficiency, harness permission systems, secrets/model API key handling, or host-side delayed execution (git hooks, .envrc). Sandboxing is mentioned only generically ('tool sandboxing'). Internal inconsistencies observed: under-studied zone count stated as both 8 and 9; defense corpus stated as 18 and 15 papers; several in-text author names do not match the reference list (e.g. 'Garcia et al. [172]' -> Zhang et al. Agent Audit; 'Mökander et al. [170]' -> Boddy & Joseph; 'Zhang et al. [168]' -> Khan et al.; 'Chen et al. [89]' -> Zhu et al.; 'Guo et al. [134]' -> Hu et al.; 'Liu et al. [29]' described as MCP servers but titled 'Malicious Agent Skills'). Headline MCP statistics come from a preprint flagged by the author as preliminary. No prompt-injection payload aimed at AI agents found in the source."
