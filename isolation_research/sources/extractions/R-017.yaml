notes: |
  Metadata: author and affiliation confirmed (Kexin Chu, University of Connecticut). The text shows arXiv:2604.23338v2 dated 6 May 2026; the csv date 2026-04-25 is presumably v1 and is plausible.
  Scope: general survey of LLM agents, not specific to coding agents. Coding-agent content: the Maloyan et al. citation (Claude Code, Copilot, Cursor; 50-80% ASR; Copilot project-file RCE), TrojanPuzzle/dependency poisoning, and skill-ecosystem poisoning.
  Not covered: shared-kernel vs. VM isolation, per-domain egress allowlists, model API key handling, whether harness permission systems are a security boundary (only the per-call access-control critique), and host-side delayed execution via agent-written files (git hooks, .envrc, IDE tasks).
  "Tool sandboxing" is recommended generically. The cited reference [120] is ToolEmu, an LM-emulated sandbox for risk identification, not an isolation mechanism.
  Internal inconsistencies:
  - Proposition 1 vs. Theorem 1 naming.
  - Under-studied zone count given as 8 in Appendix B vs. 9 elsewhere.
  - Defense paper count given as 18 vs. 15.
  - Table 13 says "headline analysis cutoff April 2025" while elsewhere the corpus is described as unified through April 2026.
  - Several in-text author names do not match the reference list: [134] Guo vs. Hu; [168] Zhang vs. Khan; [170] Mökander vs. Boddy & Joseph; [172] Garcia vs. Zhang; [132] Chen vs. Zhang; [89] Chen vs. Zhu.
  PDF-to-text conversion fragmented tables and figures, so quotes were taken from prose lines; " ... " marks line breaks.
  No prompt-injection payloads aimed at AI agents were observed in the source.
