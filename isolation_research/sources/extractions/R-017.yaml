incentives: "Single-author academic SoK; declares no competing interests. Promotes the author's own frameworks (LASM layer model, T1-T4 temporality axis, ABOM specification, action-log schema), which shapes recommendations toward layer-specific defense-in-depth and the proposed artifacts."
harness: [Claude Code, GitHub Copilot, Cursor]
included: true
inclusion_reason: "Systematic survey of threats and defenses for tool-using LLM agents (indirect prompt injection, tool sandboxing, least privilege, MCP/skill supply chain, multi-agent trust, logging), with defense recipes. It cites a prompt-injection RCE study of coding agents (Claude Code, Copilot, Cursor). It is not specific to coding agents, but the findings carry over to them."
