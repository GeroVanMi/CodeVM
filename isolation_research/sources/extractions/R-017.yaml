inclusion_reason: "Systematic survey (116 papers) of threats and defenses for tool-using LLM agents, including indirect prompt injection leading to RCE in coding agents, MCP/skill supply-chain attacks, sandboxing, least privilege and human approval; generalizes to coding agents although it is not coding-agent specific."
