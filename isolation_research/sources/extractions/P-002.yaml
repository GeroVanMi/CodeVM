inclusion_reason: "Vendor documentation with concrete isolation, filesystem, credential-protection, and egress recommendations for a coding agent, plus explicit security limitations and weakening options."
recommendations:
  - practice: os-sandbox
    stance: recommends
    claim_kind: recommendation
    boundary_strength: defense-in-depth
    summary: "Run Bash/PowerShell/Monitor commands and their child processes in an OS-level sandbox (Seatbelt on macOS, bubblewrap on Linux/WSL2) that restricts filesystem and network access."
    threats:
      - rce-via-agent
      - destructive-action
    rqs:
      - RQ2
    evidence_type: vendor-claim
    tradeoffs:
      - "Some tools are incompatible (watchman, docker, Go CLIs failing TLS verification under Seatbelt, clipboard tools) and need configuration or excludedCommands."
      - "Minimal performance overhead; some filesystem operations may be slightly slower."
      - "Native Windows and WSL1 are not supported."
    bypasses_limits:
      - "Applies only to Bash, PowerShell, and Monitor commands, not other tools."
    quote: "provides OS-level enforcement that restricts what shell commands can access at the filesystem and network level."
    location: "Section: How sandboxing relates to permissions and permission modes / Permission rules"
  - practice: os-sandbox
    stance: recommends
    claim_kind: limitation
    boundary_strength: defense-in-depth
    summary: "The sandbox reduces risk but is not a complete isolation boundary; users should review its limitations before treating it as a hard security control."
