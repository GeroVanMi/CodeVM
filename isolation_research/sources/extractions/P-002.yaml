contested_positions:
  - topic: shared-kernel-vs-vm
    position: "The built-in OS sandbox is described as risk reduction, not a complete isolation boundary or hard security control; comparison with containers and VMs is deferred to a separate Sandbox environments page, with no VM argument made here."
    quote: "Sandboxing reduces risk but is not a complete isolation boundary. Review the limitations below before relying on it as a hard security control."
    location: "Section: Limitations"
  - topic: egress-allowlist-sufficiency
    position: "The built-in proxy only filters by hostname and does not inspect TLS, so users must allow only trusted domains; organizations whose threat model needs content inspection should use a custom proxy."
    quote: "The built-in proxy enforces the allowlist based on the requested hostname and, by default, does not terminate or inspect TLS traffic."
    location: "Section: Network isolation"
  - topic: host-delayed-execution
    position: "Treated as a real risk: the sandbox denies writes to hooks, Claude config, MCP config, shell startup files, .gitconfig, .vscode/.idea, and .git hooks/config even inside writable directories, because those could run code outside the sandbox."
    quote: "Inside the directories that sandboxed commands can write to, the sandbox still denies writes to the files Claude Code loads configuration and code from. A command that could edit those files could grant itself permissions, or add a hook or MCP server that Claude Code runs outside the sandbox."
    location: "Section: Protected paths"
  - topic: harness-permissions-as-boundary
    position: "Permissions and the sandbox are presented as complementary layers: permissions decide whether a call runs, while the sandbox enforces access at OS level once it runs. Built-in file tools rely on permissions alone. The source does not explicitly call permissions a security boundary."
    quote: "Permission modes decide whether a tool call runs and whether you are prompted first, while the sandbox restricts what a Bash command can access once it runs."
    location: "Section: Permission modes"
notes: "Metadata matches the CSV. The title does not appear in the cleaned text, which starts mid-page. The page is living and undated; it references Claude Code versions up to v2.1.271. The clean.md has extraction artifacts: JSON/shell code examples and tables are missing, and link text is fragmented across lines. The source never mentions prompt injection explicitly; its threat model is implicit, centered on what sandboxed commands can read, write, and reach. No prompt-injection payloads found in the source. Operational content was skipped: platform setup, AppArmor profile for bwrap on Ubuntu 24.04, TMPDIR handling, IPv6 spelling rules, troubleshooting. The enableWeakerNetworkIsolation setting is mentioned for MITM-proxy setups without a security discussion. The @anthropic-ai/sandbox-runtime package for wrapping the whole Claude Code process is covered on a separate page."
