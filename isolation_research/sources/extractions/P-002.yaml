  - practice: credential-proxy
    stance: recommends
    claim_kind: recommendation
    summary: "Mask credentials: sandboxed commands see a per-session sentinel and the sandbox proxy substitutes the real value only on outbound requests to injectHosts that are also in the domain allowlist (requires TLS termination at the proxy; re-signs AWS SigV4)."
    threats:
      - secret-exfiltration
    rqs:
      - RQ3
      - RQ4
    evidence_type: vendor-claim
    tradeoffs:
      - "Requires network.tlsTerminate (experimental) so the proxy can see request contents."
      - "Signature-based auth needs re-signing at the proxy; some AWS request forms cannot be re-signed and fail."
      - "On macOS masked files are blocked instead of substituted, so tools using them do not work."
    bypasses_limits:
      - "Masking authorizes the proxy to send the real credential to the listed hosts; a mask entry without injectHosts substitutes on every allowed domain."
      - "With onExtractNoMatch at its default 'warn', a non-matching pattern passes the variable or file through unmasked."
      - "Mask falls back to deny for directories, globs, files over 8 MiB, or non-UTF-8 files."
    quote: "The command and anything it logs never hold the real credential, but its requests still authenticate."
    location: "Section: Mask credentials / Mask environment variables"
