  - practice: no-secrets-in-env
    stance: recommends
    claim_kind: recommendation
    summary: "Use sandbox.credentials deny entries to block reads of credential files and unset secret environment variables for sandboxed commands; deny entries merge across scopes and can only narrow access. CLAUDE_CODE_SUBPROCESS_ENV_SCRUB strips credentials from all subprocesses."
