notes: "The CSV metadata matches the text. The author is an independent security researcher, not a firm; the post's body gives no publication date, and the CSV date of 2025-12-03 fits the timeline (CVE published 2025-12-02). The post quotes the v2.0.55 changelog in two inconsistent ways: 'Fix proxy DNS resolution' and 'Fixed proxy DNS resolution being forced on by default'. The timeline says the issue was raised earlier (Nov 18, 2025) in sandbox-runtime PR #45 by bendrucker; the author reported it on Nov 21 via HackerOne #3437855. The PoC images and video are not in the text. The source takes no explicit position on the contested topics, so contested_positions is omitted; it only shows that an implementation bug defeated the documented deny-all egress setting. No prompt-injection payload found in the source."
