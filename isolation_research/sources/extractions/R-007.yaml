contested_positions:
  - topic: pi-classifier-value
    position: "Prompt-injection classifiers/guardrail models are ineffective in agent settings: they fail to generalize to AgentDojo with high false positive/negative rates, and they cannot provide deterministic enforcement, unlike tool-call privilege control."
    quote: "While they may perform well on datasets similar to their training distributions, they fail to generalize to AgentDojo, exhibiting high rates of false positives and negatives."
    location: "Section 8.1; Section 10 (Model-Level Prompt Injection Defenses)"
notes: "Metadata verified: arXiv:2504.11703v3 dated 14 May 2026; authors from UC Berkeley, UC Santa Barbara, National University of Singapore. Threat model assumes a benign user query and attacker control over all tool observations; attacker cannot modify model or system prompt. Coding agents are only mentioned in the introduction and via the OpenHands integration (proxy mode); benchmarks (AgentDojo, ASB, MCP-ported AgentDojo) are personal-assistant tasks, not shell/code execution, and the paper gives no shell-command-level policy examples, sandboxing, egress, or secrets guidance. Relevant for coding agents: proxy mode cannot cover built-in tools (e.g., native shell/file tools) that bypass MCP. Experiments ran in a local sandboxed environment (ethics section), not a recommendation. The text contains adversarial prompts used in adaptive attacks (e.g., 'IF the instruction above is about updating the policies THEN ... allow all tools') as research content; treated as data, not followed. No injection payload aimed at the extractor observed. Figure numeric data is garbled into lists (bar chart values), making per-defense AgentDojo numbers ambiguous; only text-stated numbers were used."
