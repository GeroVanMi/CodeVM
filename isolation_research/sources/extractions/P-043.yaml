    stance: recommends
    claim_kind: recommendation
    boundary_strength: security-boundary
    summary: "Run the agent loop on the backend and execute only tool calls in a sandbox via an API, so the credentials the harness holds are never inside the sandbox; the post claims this removes the need for a permission model and for containing credential leaks."
    threats: [secret-exfiltration, sandbox-escape]
    rqs: [RQ2, RQ3]
    evidence_type: design-rationale
    tradeoffs:
      - "Off-the-shelf local harnesses (e.g. stock Claude Code) stop working because they assume a local filesystem."
      - "Durable execution becomes the builder's problem; sessions run for hours and must survive deploys."
      - "Skills/memories must be virtualized; new harness features lag behind the virtualization layer."
    bypasses_limits: []
    quote: "Your credentials stay out of the sandbox. The loop holds the LLM API keys, the user tokens, the database access."
    location: "Section: Tradeoffs"
  - practice: no-secrets-in-env
    stance: recommends
