notes: >
  Metadata matches the text as far as can be checked (the text has no byline or date; the author, org, and date come from the CSV).
  Most of the post covers operational design choices that were left out of recommendations as non-security:
  durable execution with Inngest, sandbox suspend/resume with Blaxel (25ms resume), disposable "cattle" sandboxes,
  and keeping skills and memories in a database (Postgres) behind a virtualized read/write/edit filesystem interface.
  Org-shared memory is a database write scoped to the organization. Memory-poisoning risk across users is not discussed.
  The post says "bash is a leak": bash bypasses the virtualization layer. Its two guards (a system-prompt instruction
  and tree-sitter parsing of bash commands) are described as best-effort ("Neither is airtight"). They serve correctness,
  not security, so they are not recorded as security controls.
  The post does not name a sandbox isolation technology, does not cover egress control or prompt injection, and does not
  discuss the threat of a compromised sandbox acting through tool results returned to the harness.
  No prompt-injection payload was observed in the source.
