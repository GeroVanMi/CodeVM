inclusion_reason: "Gives concrete risk analysis and mitigations for AI coding assistants: indirect prompt injection with exfiltration via links/Markdown images, package hallucination/supply chain, sandboxing the dev environment, extensions acting on internal resources, secret leakage through prompts, and review of generated code. Pre-agentic (IDE plugin/chatbot focus) but generalizes to coding agents."
