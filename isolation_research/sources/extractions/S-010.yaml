notes: |
  Document states "Last updated: September 2024"; csv date 2024-10-04 is plausibly the web publication date. Title in the document is simply "AI Coding Assistants"; published by BSI and ANSSI jointly.
  Scope is pre-agentic: IDE plugins and chatbots offering suggestions; agentic execution is only touched via "extensions which can take actions on behalf of programmers". The source does not discuss shared-kernel vs VM boundaries (it only says "sandboxing the development environment" without specifying technology), egress allowlists, prompt-injection classifiers, harness permission systems, or agent-written files executed later on the host (git hooks, .envrc, IDE tasks).
  Prompt-injection defense is largely delegated to providers; user-side measures are awareness, keeping secrets out of prompts, and code review. Risk taxonomy: input confidentiality, automation bias, output quality/security, supply chain (package hallucination, indirect PI, poisoning, extensions), misuse for attacks.
  No prompt-injection payloads aimed at AI agents were observed in the source. Text has minor typos in the original (e.g. "posioning", "plattforms"), preserved in quotes. Previous attempt failed on a quote ending in a line-end hyphen ("AI-"); replaced with a quote from the following line.
