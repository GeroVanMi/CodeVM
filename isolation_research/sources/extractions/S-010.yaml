notes: |
  Metadata: the document says "Last updated: September 2024"; the CSV date 2024-10-04 is probably the web publication date. The PDF names BSI (Bonn) and ANSSI as authors, which matches author_org.
  Scope: the source covers completion-style IDE assistants and chatbots, not autonomous coding agents. It has no guidance on isolation technology choices (sandboxing is mentioned only generically, against malicious libraries), on network egress beyond restricting image rendering to trusted sources, or on harness permissions. It takes no explicit positions on the contested topics, so contested_positions is omitted.
  Omitted non-security or operational recommendations: productivity and employee-satisfaction discussion; scaling QA/AppSec teams with developer productivity (recorded as a tradeoff of code review); an evaluation phase that monitors key figures such as security-team workload; keeping developers able to work without AI (skill retention); public "deconstruction" of AI code and prompts in internal code reviews; translation research agenda. Misuse of LLMs by attackers (3.5) is out of scope and only referenced.
  Extraction: plain PDF text extraction. Bullet glyphs are missing in sections 3.4.3 and 3.4.4, and the source has typos (e.g. "posioning"), which quotes keep verbatim. No prompt-injection payloads were found in the source.
