harness: []
included: true
inclusion_reason: "Gives concrete security recommendations for AI coding assistants: code review, sandboxing the development environment against malicious packages, package allowlisting, indirect prompt-injection exfiltration defenses (restricting image rendering), secret handling and extension restrictions. It is pre-agentic and generic about harnesses, but the advice carries over to coding agents."
recommendations:
  - practice: code-review-integrity
    stance: recommends
    claim_kind: recommendation
    summary: "Developers should check, understand and reproduce generated code, with critical review for hallucinations and security risks. Security teams can add reviews, but must scale with the extra AI-generated code."
    threats: [code-integrity, supply-chain-compromise, prompt-injection-indirect]
    rqs: [RQ5, RQ6]
    evidence_type: citation
    tradeoffs:
      - "AI-assisted developers might produce more code, so security/QA teams (AppSec, DevSecOps) may need to scale accordingly."
    bypasses_limits:
      - "Automation bias: developers tend to perceive AI output as secure and accept well-worded but flawed code."
    quote: "Generated source code should generally be checked and reproduced by the developers."
    location: "Section 3.4.1 Hallucinations of Methods and Packages, mitigation measures (repeated in 3.4.2, 4.2, Executive Summary)"
